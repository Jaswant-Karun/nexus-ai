name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python API dependencies
        run: python -m pip install --disable-pip-version-check ./backend/api

      - name: Run Python tests
        run: pnpm test:python

      - name: Typecheck workspace applications
        run: pnpm typecheck

      - name: Build workspace applications
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus_ai
        run: pnpm build