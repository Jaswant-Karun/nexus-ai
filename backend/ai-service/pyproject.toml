[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai-service"
version = "1.0.0"
description = "NEXUS AI — Full-stack AI microservice with agents, RAG, embeddings, planning, reasoning, and workflow generation"
requires-python = ">=3.11"
dependencies = [
  # Web framework
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27,<1.0",

  # AI / LLM providers
  "openai>=1.50,<2.0",
  "anthropic>=0.34,<1.0",
  "google-generativeai>=0.8,<1.0",
  "tiktoken>=0.8,<1.0",

  # LangChain ecosystem
  "langchain>=0.3,<1.0",
  "langchain-openai>=0.2,<1.0",
  "langchain-anthropic>=0.2,<1.0",
  "langchain-community>=0.3,<1.0",
  "langchain-core>=0.3,<1.0",
  "langgraph>=0.2,<1.0",

  # Vector store / embeddings
  "qdrant-client>=1.11,<2.0",
  "sentence-transformers>=3.2,<4.0",
  "numpy>=1.26,<3.0",
  "scipy>=1.14,<2.0",
  "faiss-cpu>=1.9,<2.0",

  # NLP / text processing
  "nltk>=3.9,<4.0",
  "spacy>=3.7,<4.0",
  "transformers>=4.45,<5.0",
  "torch>=2.4; sys_platform != 'darwin'",
  "einops>=0.8,<1.0",

  # Reranking / cross-encoder
  "cross-encoder>=0.1,<1.0",
  "cohere>=5.11,<6.0",

  # Document processing
  "pypdf>=5.0,<6.0",
  "python-docx>=1.1,<2.0",
  "python-pptx>=1.0,<2.0",
  "openpyxl>=3.1,<4.0",
  "pytesseract>=0.3,<1.0",
  "Pillow>=11.0,<12.0",

  # Database / caching
  "asyncpg>=0.30,<1.0",
  "redis>=5.2,<6.0",
  "psycopg2-binary>=2.9,<3.0",

  # Utilities
  "tenacity>=9.0,<10.0",
  "structlog>=24.4,<25.0",
  "python-dotenv>=1.0,<2.0",
  "rich>=13.8,<14.0",
  "typer>=0.12,<1.0",
  "jinja2>=3.1,<4.0",
  "aiofiles>=24.1,<25.0",
  "shortuuid>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["__pycache__", "*.egg-info"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
